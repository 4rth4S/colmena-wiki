<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Body (abdomen) -->
  <ellipse cx="64" cy="76" rx="28" ry="36" stroke="currentColor" stroke-width="4"/>
  <!-- Body stripes -->
  <path d="M40 62 h48 M38 76 h52 M42 90 h44" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <!-- Thorax -->
  <ellipse cx="64" cy="40" rx="18" ry="14" stroke="currentColor" stroke-width="4"/>
  <!-- Head -->
  <circle cx="64" cy="22" r="12" stroke="currentColor" stroke-width="4"/>
  <!-- Antennae -->
  <path d="M58 13 Q52 4 46 2 M70 13 Q76 4 82 2" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Wings -->
  <ellipse cx="44" cy="54" rx="13" ry="20" stroke="currentColor" stroke-width="3" transform="rotate(-30 44 54)"/>
  <ellipse cx="84" cy="54" rx="13" ry="20" stroke="currentColor" stroke-width="3" transform="rotate(30 84 54)"/>
  <!-- Legs (3 pairs) -->
  <path d="M44 84 L36 112 M54 92 L50 118 M74 92 L78 118 M84 84 L92 112" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="64" cy="20" r="3" fill="currentColor"/>
  <!-- Stinger -->
  <path d="M64 112 L64 120" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
</svg>
