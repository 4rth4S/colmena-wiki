<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Outer hexagon -->
  <polygon points="64,10 120,42 120,86 64,118 8,86 8,42" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
  <!-- Inner cell structure (honeycomb Y) -->
  <line x1="64" y1="10" x2="64" y2="118" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="8" y1="42" x2="120" y2="86" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="8" y1="86" x2="120" y2="42" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <style>
    @media (prefers-color-scheme: dark) {
      svg { color: #f59e0b; }
    }
    @media (prefers-color-scheme: light) {
      svg { color: #0a0a0f; }
    }
  </style>
</svg>
